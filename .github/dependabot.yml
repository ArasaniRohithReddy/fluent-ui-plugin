# Dependabot configuration.
#
# Security alerts were already on, but with no config here Dependabot only ever
# opened security PRs — one per vulnerable package, ungrouped. Three arrived at
# once (fast-uri, hono, qs) and each had to be merged separately with a rebase
# in between, because they all touch the same package-lock.json.
#
# Grouping fixes that: related bumps land in one PR with one lockfile change.
#
# Note our own direct dependencies are tiny (@modelcontextprotocol/sdk and zod
# in mcp/). Everything Dependabot has flagged so far has been transitive, pulled
# in through the SDK's HTTP transport — which this server does not use, since it
# runs over stdio. That lowers the real risk but is not a reason to leave them
# unpatched, so we take the updates.
version: 2

updates:
  # The MCP server — the part users actually run.
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is a migration, not a bump: it changes module resolution
      # and the build fails repo-wide ("Cannot find name 'node:fs'",
      # "Cannot find name 'process'", "Property 'url' does not exist on type
      # 'ImportMeta'"). Reopening it weekly just produces a permanently red PR.
      # Remove this entry when someone takes the migration on deliberately.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      # One PR for routine bumps keeps the lockfile conflicts down. Security
      # fixes are deliberately NOT grouped — they should be reviewable and
      # mergeable on their own, without waiting on unrelated updates.
      mcp-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # The GitHub Pages site.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # react and react-dom are peer partners and must move together, but
      # Dependabot raises them as separate PRs — so each one alone fails to
      # install with ERESOLVE and can never be merged. A React 19 move needs
      # both in one PR plus a real render check, since a passing build is not
      # proof the Fluent UI v9 site still looks right. Remove both entries when
      # doing that upgrade on purpose.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
    groups:
      site-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Workflow actions go stale silently — nothing fails, they just drift onto
  # unsupported runners until a deprecation breaks CI without warning.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
