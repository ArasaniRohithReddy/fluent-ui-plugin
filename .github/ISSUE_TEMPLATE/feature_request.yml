name: Feature request
description: Suggest a new capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please describe the problem you want to solve, not only the solution, so we can find the best approach together.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like the plugin to do?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which surface does this involve?
      options:
        - Web (React v9 or Web Components)
        - Power BI
        - Power Platform
        - Tokens and theming
        - MCP tools
        - Agents or skills
        - Documentation or site
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you have thought about.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to the official Fluent 2 docs, mockups, or examples.
    validations:
      required: false
